<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AD3BF"/><stop offset="1" stop-color="#0E8C9B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="#05121F"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#g)"/>

  <text x="64" y="136" font-size="27" font-weight="650" fill="#2AD3BF"
        letter-spacing="2.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">HOW IT WORKS</text>
  <text font-size="54" font-weight="680" fill="#F4F7FA" letter-spacing="-0.8"
