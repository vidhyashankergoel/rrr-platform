    <text x="108" y="625" font-size="22" font-weight="700" fill="#05121F"
          text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">2</text>
    <text x="148" y="628" font-size="34" fill="#F4F7FA"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Watch the SLO</text>
  </g>
  <path d="M108 675 L108 695"
          stroke="#0E8C9B" stroke-width="3" stroke-linecap="round"/>
  <g>
    <rect x="64" y="699" width="1072" height="108" rx="16" fill="#0C1E2E" stroke="#0E8C9B" stroke-opacity="0.45"/>
    <circle cx="108" cy="753" r="15" fill="#2AD3BF"/>
    <text x="108" y="761" font-size="22" font-weight="700" fill="#05121F"
