  </text>
  <g>
    <rect x="64" y="427" width="1072" height="108" rx="16" fill="#0C1E2E" stroke="#0E8C9B" stroke-opacity="0.45"/>
    <circle cx="108" cy="481" r="15" fill="#2AD3BF"/>
    <text x="108" y="489" font-size="22" font-weight="700" fill="#05121F"
          text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">1</text>
    <text x="148" y="492" font-size="34" fill="#F4F7FA"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Deploy to a slice</text>
  </g>
  <path d="M108 539 L108 559"
