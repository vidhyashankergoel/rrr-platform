name: CI

# Runs on every push and pull request to main. The suites here are the ones
# that need no server and no credentials, so they work on a fresh runner —
# types, the agents, the auto-reply templates, the booking logic and the
# delivery plane. The browser suites need a running server and are left to
# `npm run test:e2e` locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Types and test suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    env:
      # A scratch SQLite file. No real data ever reaches CI.
      DATABASE_URL: "file:./ci.db"
      # Explicitly empty so nothing can attempt to send mail or call a model
      # from a build. A test that quietly emails somebody is a bad test.
      RESEND_API_KEY: ""
      SMTP_HOST: ""
      LLM_BASE_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Create the scratch database
        run: npx prisma db push --skip-generate

      - name: Typecheck the application
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck the scripts
        # The scripts are standalone programs with their own config and are
        # excluded from the Next build, so they need a second pass. Missing
        # this is how a type error in an agent reaches main.
        run: npx tsc --noEmit -p tsconfig.scripts.json

      - name: Security
        # Throttling, authentication, what leaves in a response, what reaches
        # the logs, consent evidence and headers. The site is public and the
        # database holds other people's personal information.
        run: npx tsx scripts/security-test.ts

      - name: Assistant chips
        # 84 tests that existed and had never run on a push. They need no
        # server and no credentials, so there was no reason for the gap —
        # it was simply missed when the job was written.
        run: npx tsx scripts/chip-test.ts

      - name: Operations agents
        run: npx tsx scripts/ops-test.ts

      - name: Auto-reply templates
        run: npx tsx scripts/email-template-test.ts

      - name: Call booking
        run: npx tsx scripts/booking-test.ts

      - name: Attribution modes
        run: npx tsx scripts/attribution-test.ts

      - name: Delivery plane
        run: npx tsx scripts/bridge-test.ts

      - name: Retrieval ranking
        run: npx tsx scripts/retrieval-debug.ts

      - name: Customer journey and consent handling
        run: npx tsx scripts/journey-test.ts

      - name: Production build
        run: npm run build

  secrets:
    name: No credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for credential-shaped strings
        # This repository is public. A key committed by accident is public the
        # moment it is pushed, and rotating it is the only real remedy — so
        # fail the build loudly rather than let one sit unnoticed.
        run: |
          set -euo pipefail
          pattern='re_[A-Za-z0-9]{24,}|gh[pousr]_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY'
          if grep -rEn "$pattern" \
              --include='*.ts' --include='*.tsx' --include='*.js' \
              --include='*.json' --include='*.yml' --include='*.md' \
              --exclude-dir=node_modules . ; then
            echo "::error::A credential-shaped string is present. Remove it and rotate the credential."
            exit 1
          fi
          echo "No credential-shaped strings found."

      - name: Ensure no outreach target list was committed
        # data/outreach-targets.json holds the names, roles and employers of
        # real people. In a public repository that is their personal
        # information published without their knowledge — a PIPEDA problem
        # and a straightforwardly bad thing to do to somebody.
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)outreach-targets\.json$' ; then
            echo "::error::An outreach target list is tracked. It contains other people's personal information — remove it from the index and from history."
            exit 1
          fi
          echo "No outreach target lists tracked."

      - name: Ensure no database was committed
        # Lead, Conversation and Booking rows contain real names, email
        # addresses and what people told us in confidence. A committed
        # database is a PIPEDA breach, not untidiness.
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(db|sqlite3?)$' ; then
            echo "::error::A database file is tracked. Remove it from history and rotate anything it exposed."
            exit 1
          fi
          echo "No database files tracked."

  browser:
    name: Accessibility and layout, in a real browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    # Two suites that need a rendered page and therefore a booted server:
    #
    #   contrast-test    measures the computed colour of every text node
    #                    against its composited background, across every page
    #                    in both themes. It is what proves the WCAG 2.1 AA
    #                    claim the stylesheet and /legal/accessibility make,
    #                    and it existed for months without ever running on a
    #                    push.
    #
    #   responsive-test  asserts the three things that actually break on a
    #                    phone: horizontal overflow, tap targets under the AA
    #                    minimum, and text collapsed below readable size.
    #
    # Both were being checked by hand, which means both were being checked
    # when somebody remembered.
    #
    # e2e-test is deliberately not here. It resets a sandbox database and
    # drives every form on the site, so it is a longer job with more to go
    # wrong, and it belongs in its own workflow rather than bolted onto this.

    env:
      DATABASE_URL: "file:./ci.db"
      RESEND_API_KEY: ""
      SMTP_HOST: ""
      LLM_BASE_URL: ""
      # The start script serves on 3000; both suites default to 3111.
      TEST_BASE: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Create the scratch database
        run: npx prisma db push --skip-generate

      - name: Install the browser
        # Chromium only. The suites measure computed styles and geometry,
        # which do not differ enough between engines to justify tripling the
        # install time on every push.
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start the server
        run: npm start &

      - name: Wait for it to answer
        # Poll rather than sleep: a fixed wait is either too short on a slow
        # runner or wasted on a fast one, and this is the kind of flake that
        # gets a whole job disabled rather than fixed.
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the server never answered on :3000"
          exit 1

      - name: Colour contrast (WCAG 2.1 AA)
        run: npx tsx scripts/contrast-test.ts

      - name: Responsive layout and tap targets
        run: npx tsx scripts/responsive-test.ts
