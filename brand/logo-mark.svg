<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="RRR Solution Providers">
  <title>RRR Solution Providers — mark</title>
  <defs>
    <linearGradient id="rrrTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AD3BF"/>
      <stop offset="1" stop-color="#0E8C9B"/>
    </linearGradient>
    <linearGradient id="rrrAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC25C"/>
      <stop offset="1" stop-color="#F0A830"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="96" height="96" rx="22" fill="#05121F"/>

  <!--
    Three ascending strokes: the three R's, and a stack that rises.
    Each is a vertical stem with a shoulder and a kicked leg — an R reduced
    to its skeleton, so it reads as a monogram at 96px and as a mark at 16px.
  -->

  <!-- R1 — back, smallest, amber accent -->
  <g stroke="url(#rrrAmber)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M27 67V47h7.5a6 6 0 0 1 0 12H27l9 8"/>
  </g>

  <!-- R2 — middle -->
  <g stroke="url(#rrrTeal)" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M41 62V38h9a7 7 0 0 1 0 14h-9l11 10"/>
  </g>

  <!-- R3 — front, largest -->
  <g stroke="#2AD3BF" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 56V26h10.5a8 8 0 0 1 0 16H56l13 14"/>
  </g>
</svg>
